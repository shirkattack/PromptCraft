    <line x1="44" y1="40" x2="56" y2="40" stroke="#6B7280" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="58" x2="76" y2="58" stroke="#6B7280" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="132" y="78" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#F9FAFB">Prompt<tspan fill="#818CF8">Craft</tspan></text>
