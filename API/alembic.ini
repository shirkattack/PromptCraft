# Alembic configuration. The database URL is taken from the application
# settings (DATABASE_URL) in alembic/env.py, so it is not repeated here.
#
#   cd API && alembic upgrade head          # apply migrations
#   cd API && alembic revision --autogenerate -m "describe change"
#
# The API also applies pending migrations on startup (app/core/migrations.py).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
